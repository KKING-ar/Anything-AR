<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إعادة التوجيه...</title>
    <script>
      (() => {
        const currentPath = window.location.pathname || '/';
        const currentSearch = window.location.search || '';
        const currentHash = window.location.hash || '';

        const fallbackBase = 'https://anything-ar.framer.website';

        let cleanPath = currentPath;
        if (cleanPath === '/anything-ar' || cleanPath === '/anything-ar/') {
          cleanPath = '/';
        } else if (cleanPath.startsWith('/anything-ar/')) {
          cleanPath = cleanPath.replace(/^\/anything-ar/i, '');
        } else if (cleanPath.startsWith('/Anything-AR/')) {
          cleanPath = cleanPath.replace(/^\/Anything-AR/i, '');
        }

        if (!cleanPath || cleanPath === '') {
          cleanPath = '/';
        }

        const target = `${fallbackBase}${cleanPath}${currentSearch}${currentHash}`;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>جاري إعادة التوجيه إلى الموقع الجديد...</p>
  </body>
</html>
